<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(남의) 연애 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 py-6 px-3 sm:px-4">

    <div id="app" class="max-w-2xl mx-auto space-y-4">
        <main id="viewerCard" class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-md overflow-hidden">

            <!-- 헤더 -->
            <div class="border-b border-gray-100 dark:border-slate-800 p-4 sm:p-5 bg-slate-50/50 dark:bg-slate-900/50">
                <div class="flex justify-between items-center text-xs text-red-600 dark:text-red-400 font-semibold mb-1">
                    <span class="flex items-center"><i data-lucide="message-square" class="w-3.5 h-3.5 mr-1"></i> (남의) 연애 게시판</span>
                    <span class="bg-red-50 dark:bg-red-950/60 px-2 py-0.5 rounded text-[11px]">익명</span>
                </div>
                <h2 id="displayPostTitle" class="text-base sm:text-xl font-bold text-gray-900 dark:text-gray-50 leading-snug mt-1 break-words"></h2>

                <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 mt-3 pt-3 border-t border-gray-100 dark:border-slate-800/80">
                    <div class="flex items-center space-x-2">
                        <span class="font-medium text-gray-700 dark:text-gray-300 flex items-center">
                            <span class="text-xs mr-1">🍎</span>익명
                        </span>
                        <span>•</span>
                        <span id="displayPostTime">--</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="flex items-center"><i data-lucide="eye" class="w-3.5 h-3.5 mr-1"></i> <span id="displayViews">0</span></span>
                        <button onclick="togglePostLike()" class="flex items-center text-red-500 hover:text-red-600 transition-transform active:scale-125 cursor-pointer select-none">
                            <i data-lucide="thumbs-up" class="w-3.5 h-3.5 mr-1"></i>
                            <span id="displayLikes">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 본문 -->
            <div class="p-4 sm:p-6 text-sm sm:text-base leading-relaxed text-gray-800 dark:text-gray-200 min-h-[150px] border-b border-gray-100 dark:border-slate-800">
                <div id="displayPostContent" class="whitespace-pre-wrap break-words"></div>
            </div>

            <!-- 댓글 -->
            <div class="p-4 sm:p-5">
                <h3 class="text-xs sm:text-sm font-bold text-gray-700 dark:text-gray-300 flex items-center mb-4">
                    <i data-lucide="message-circle" class="w-4 h-4 mr-1.5 text-red-500"></i>
                    댓글 <span id="displayCommentCount" class="text-red-600 dark:text-red-400 ml-1">0</span>개
                </h3>
                <div id="commentsContainer" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script type="module">
        let updateDoc, increment;

        /* =====================================================================
         *  ★★★ 글쓴이 댓글 추가 방법 ★★★
         *
         *  댓글/대댓글 객체에 `isAuthor: true` 한 줄만 넣으면 "글쓴이" 댓글이 됩니다.
         *  (글쓴이 배지가 붙고, 카드가 연한 빨간색으로 강조돼요)
         *
         *  1) 일반 익명 댓글  →  { text: "내용", likes: 0 }
         *       - 닉네임은 위에서부터 순서대로 익명1, 익명2 ... 자동 부여됩니다.
         *       - 같은 사람이 또 쓴 걸로 하고 싶으면 author: "익명3" 처럼 직접 지정하세요.
         *
         *  2) 글쓴이 댓글    →  { isAuthor: true, text: "내용", likes: 0 }
         *
         *  3) 글쓴이 대댓글  →  comments의 replies 배열 안에
         *                       { isAuthor: true, text: "내용", likes: 0 } 추가
         *
         *  4) 대댓글 달기    →  댓글 객체에 replies: [ {...}, {...} ] 를 붙이면 됩니다.
         *
         *  글쓴이를 제외한 모든 사람은 자동으로 익명 처리됩니다.
         * ===================================================================== */

        const DEFAULT_POST_DATA = {

            content: "ㅈㄱㄴ",
            comments: [

                        { text: "호들갑ㄴ 애기 땐 다 그렇지", likes: 0 },
                        { isAuthor: true, text: "3살 차인데 중딩때 지 졸업식 안가고 형 졸업식 가겠다고 떼쓰다 혼남", likes: 0 },
                        { text: "이것도 좀 애매하다", likes: 0 },
                        { isAuthor: true, text: "초등학교는 같이 다녔는데 중,고등학교는 같이 못다녔다고 대학은 무조건 같이 다닐거라고 하향지원함 나는 ㅅㅂ 우주상향으로 예비받고 들어왔는데..", likes: 0 },
                        { text: "제목 고쳐라 쌍둥이 오빠가 옆집 오빠 사랑하는듯으로", likes: 0 },
                        { text: "공부 열심히해서 상향지원 한것도 아니고 하향지원은 ㄹㅇ 사랑이다", likes: 0 },
                    ]
                },

                // ── 일반 익명 댓글 (자동으로 익명1) ──
                { text: "또 잼컨 하나 왔네 아 도파민 싹 돌아", likes: 0 },

                // ── ★ 글쓴이 댓글: isAuthor: true 만 추가하면 됩니다 ──
                { isAuthor: true, text: "편의상 옆집오빠 멍뭉이 닮았으니까 멍오빠라고하고 내 쌍둥이는 둥이라고 하겠음", likes: 0 },
                // ── 여기에 댓글을 계속 추가하세요 ──
                 {
                    text: "멍오빠도 둥이가 자기 좋아하는거 알고있음?", likes: 0,
                    replies: [
                        // ── ★ 글쓴이 대댓글: replies 안에서도 isAuthor: true ──
                        { isAuthor: true, text: "그건 모르겠음 멍오빠가 눈치가 없는 건지 없는척 하는건지 사람이 좀 어려움", likes: 0 },
                        { text: "멍오빠도 남자 좋아함?", likes: 0 },
                        { isAuthor: true, text: "헤테로 같음 여자친구 만나는 것 밖에 못봤어 근데 또 모르지 둥이는 확실히 남자자석인데 멍오빠는 사람자석임 여자, 남자 다 붙음", likes: 0 },
                        { text: "남자자석 썰 풀어줘", likes: 0 },
                        { isAuthor: true, text: "그냥 친하게 지내던 애들이랑 갑자기 안놀길래 너 왜 요즘 걔랑 안노냐니까 고백 받아서 친구 못한다고 했음 그런게 세번 넘음", likes: 0 },
                    ]
                },
                {
                    text: "멍둥이야 둥멍이야?", likes: 0,
                    replies: [
                        // ── ★ 글쓴이 대댓글: replies 안에서도 isAuthor: true ──
                        { isAuthor: true, text: "멍둥", likes: 0 },
                        { text: "근거는?", likes: 0 },
                        { isAuthor: true, text: "둘이 키차이 10센치 넘게 남", likes: 0 },
                        { text: "둥이가 좀 아담하구나", likes: 0 },
                        { isAuthor: true, text: "ㄴㄴ 둥이 평균임 걍 멍오빠가 개큼", likes: 0 },
                        { text: "덩케 맛있다", likes: 0 },
                    ]
                },
                { isAuthor: true, text: "지금 둥이 기분 안좋음 에타에 멍오빠 찾는글 올라왔길래 봤냐니까 봤으니까 꺼지래", likes: 0 },
                {
                    isAuthor: true, text: "멍둥 둘이 또 싸운다", likes: 0,
                    replies: [
                        { text: "사랑싸움?", likes: 0 },
                        { isAuthor: true, text: "멍오빠 우리집에서 자고간다고 둥이한테 같이 침대에서 자자고 함\n둥 : 형 덩치를 생각해라 우리가 어떻게 슈퍼싱글 침대에서 같이자냐 나는 소파에서 자겠다\n멍 : 서운하게 하지마라 무조건 한방에서 자야한다\n둥 : 나는 바닥에서 못잔다 알지않냐\n멍 : 그러니까 침대에서 같이 자자는거 아니냐\n둥 : 그냥 형 집에 가라", likes: 0 },
                        { text: "진짜 눈치가 없으신건지 모르는척 하시는건지", likes: 0 },
                        { isAuthor: true, text: "바로 옆집 살면서 왜 자고가는건지 모르겠음", likes: 0 },
                    ]
                },
                {
                    isAuthor: true, text: "집앞에서 멍오빠 만나서 둘이 카페갔는데 십분만에 내 이름 둥이이름으로 네번이나 잘못부름;;", likes: 0,
                    replies: [
                        { text: "둘이 이름 비슷함?", likes: 0 },
                        { isAuthor: true, text: "끝글자만 달라서 비슷하긴한데 함께 한 세월이 이름을 헷갈릴만한 세월이 아님ㅠ", likes: 0 },
                    ]
                },
                {
                    text: "언제부터 아는 사이였어?", likes: 0,
                    replies: [
                        // ── ★ 글쓴이 대댓글: replies 안에서도 isAuthor: true ──
                        { isAuthor: true, text: "태어날때부터", likes: 0 },
                        { text: "그럼 한번도 떨어져본적 없는거임?", likes: 0 },
                        { isAuthor: true, text: "멍오빠 군대 1년반 제외하면 없음", likes: 0 },
                        { isAuthor: true, text: "둥이 멍오빠 훈련소 보내고 집가는 차안에서 움 다시 생각해도 개웃기네 이모(멍오빠 엄마)도 안울었는데", likes: 0 },
                        { text: "헐ㅠ 귀엽다", likes: 0 },
                    ]
                },
                {
                    text: "너는 멍오빠 좋아한적 없음?", likes: 0,
                    replies: [
                        { isAuthor: true, text: "나는 좀 지팔지꼰 하는편이라 나쁜남자 좋아함 멍오빠는 유죄인간 스타일", likes: 0 },
                    ]
                },
                {
                    isAuthor: true, text: "둥이 예대 근처 서성이다가 나한테 걸림 멍오빠가 그렇게 좋냐니까 산책온거야 ㅇㅈㄹ하고 지도 아니다 싶었는지 티 많이나? 이럼 그럼 티가 안나겠냐 경영대 사람이 예대에 왜가는데", likes: 0,
                    replies: [
                        { text: "멍오빠 예대 소속이야?", likes: 0 },
                        { isAuthor: true, text: "응 연극학부", likes: 0 },
                        { text: "인기 많겠다", likes: 0 },
                        { isAuthor: true, text: "학교 유명인사임 에타 단골손님", likes: 0 },
                    ]
                },
                {
                    text: "둥이 대학에서는 남자자석 안함?", likes: 0,
                    replies: [
                        { isAuthor: true, text: "학교 응원단 공연보고 인스타 팔로랑 디엠 많이 오는데 남자 꽤 많더라ㅎㅋ", likes: 0 },
                        { text: "여자한테도 인기 많겠는데?", likes: 0 },
                        { isAuthor: true, text: "ㅇㅇ 골고루 인기 많아 남자자석이라는게 남자만 당긴다는 말이 아니라 비교적 남자가 많이 붙는다는 말이었어", likes: 0 },
                    ]
                },
            ]
        };

        let POST_DATA = JSON.parse(JSON.stringify(DEFAULT_POST_DATA));
        let db, postRef;

        /* ---------- Firebase 연동 (실패해도 글은 정상 표시, 좋아요는 로컬 동작) ---------- */
        async function initFirebase() {
            try {
                const BASE = "https://www.gstatic.com/firebasejs/11.6.1/";
                const [{ initializeApp }, { getAuth, signInAnonymously, signInWithCustomToken }, fs] = await Promise.all([
                    import(BASE + "firebase-app.js"),
                    import(BASE + "firebase-auth.js"),
                    import(BASE + "firebase-firestore.js")
                ]);
                const { getFirestore, doc, onSnapshot, setDoc } = fs;
                updateDoc = fs.updateDoc;
                increment = fs.increment;

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'anonymous-forum-app';
                const firebaseConfig = typeof __firebase_config !== 'undefined'
                    ? JSON.parse(__firebase_config)
                    : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo-app" };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                postRef = doc(db, 'artifacts', appId, 'public', 'data', 'forum_posts', 'main_post');

                onSnapshot(postRef, (snap) => {
                    if (snap.exists()) {
                        const cloud = snap.data();
                        POST_DATA.likes = cloud.likes ?? 0;
                        Object.entries(cloud.commentLikes || {}).forEach(([key, val]) => {
                            const [cIdx, rIdx] = key.split('_').map(Number);
                            const c = POST_DATA.comments[cIdx];
                            if (!c) return;
                            if (Number.isNaN(rIdx)) c.likes = val;
                            else if (c.replies && c.replies[rIdx]) c.replies[rIdx].likes = val;
                        });
                    } else {
                        setDoc(postRef, { likes: 0, commentLikes: {} });
                    }
                    renderPost();
                }, (err) => { console.error("Firestore sync error:", err); renderPost(); });

            } catch (err) {
                console.warn("Firebase 연동 불가 (로컬 동작 모드):", err);
                renderPost();
            }
        }

        /* ---------- 렌더링 ---------- */
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

        // 닉네임 결정: 글쓴이 → '글쓴이' 배지 / 그 외 → author 지정값 또는 익명N 자동 번호
        function nameHtml(item, counter, prefix) {
            if (item.isAuthor) {
                return `<span class="text-[10px]">${prefix}🍎</span>
                        <span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">글쓴이</span>`;
            }
            const name = item.author || `익명${++counter.n}`;
            return `<span class="text-[10px]">${prefix}🍎</span><span>${esc(name)}</span>`;
        }

        function itemHtml(item, counter, { prefix, likeCall, textClass, wrapClass }) {
            return `
                <div class="${wrapClass}">
                    <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 mb-1.5">
                        <div class="flex items-center space-x-1 font-semibold text-gray-700 dark:text-gray-300">
                            ${nameHtml(item, counter, prefix)}
                        </div>
                        <div class="flex items-center space-x-2 text-[11px]">
                            <span>${esc(item.time || '방금 전')}</span>
                            <button onclick="${likeCall}" class="flex items-center text-red-500 font-medium hover:text-red-600 transition-transform active:scale-125 cursor-pointer select-none">
                                <i data-lucide="thumbs-up" class="w-3 h-3 mr-0.5 inline"></i><span>${item.likes || 0}</span>
                            </button>
                        </div>
                    </div>
                    <div class="${textClass} whitespace-pre-wrap">${esc(item.text)}</div>
                </div>`;
        }

        window.renderPost = function () {
            try {
                document.getElementById('displayPostTitle').innerText = POST_DATA.title || '';
                document.getElementById('displayPostTime').innerText = POST_DATA.time || '방금 전';
                document.getElementById('displayViews').innerText = (POST_DATA.views || 0).toLocaleString();
                document.getElementById('displayLikes').innerText = (POST_DATA.likes || 0).toLocaleString();
                document.getElementById('displayPostContent').innerText = POST_DATA.content || '';

                const container = document.getElementById('commentsContainer');
                container.innerHTML = '';
                const comments = POST_DATA.comments || [];
                const counter = { n: 0 };   // 익명 번호 자동 부여용
                let total = 0;

                const textClass = 'text-xs sm:text-sm text-gray-800 dark:text-gray-200 break-words leading-relaxed';

                comments.forEach((c, ci) => {
                    total += 1 + (c.replies ? c.replies.length : 0);

                    // 글쓴이 댓글은 카드 배경/테두리를 연한 빨강으로 강조
                    const cardClass = c.isAuthor
                        ? 'bg-red-50/70 dark:bg-red-950/30 border-red-200 dark:border-red-900/60'
                        : 'bg-slate-50 dark:bg-slate-800/60 border-slate-100 dark:border-slate-800';

                    let html = itemHtml(c, counter, { prefix: '', likeCall: `toggleCommentLike(${ci})`, textClass, wrapClass: '' });

                    (c.replies || []).forEach((r, ri) => {
                        html += itemHtml(r, counter, {
                            prefix: '↳ ',
                            likeCall: `toggleReplyLike(${ci}, ${ri})`,
                            textClass,
                            wrapClass: 'mt-2.5 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 pl-3 border-l-2 border-l-red-400 dark:border-l-red-500'
                        });
                    });

                    const el = document.createElement('div');
                    el.className = `w-full rounded-xl px-3 py-3 text-left border ${cardClass}`;
                    el.innerHTML = html;
                    container.appendChild(el);
                });

                document.getElementById('displayCommentCount').innerText = total;
                if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
            } catch (err) {
                console.error("Rendering error:", err);
            }
        };

        /* ---------- 좋아요 ---------- */
        window.togglePostLike = async function () {
            POST_DATA.likes = (POST_DATA.likes || 0) + 1;
            renderPost();
            if (postRef && updateDoc) {
                try { await updateDoc(postRef, { likes: increment(1) }); } catch (e) { console.error(e); }
            }
        };

        window.toggleCommentLike = async function (ci) {
            const c = POST_DATA.comments[ci];
            if (!c) return;
            c.likes = (c.likes || 0) + 1;
            renderPost();
            if (postRef && updateDoc) {
                try { await updateDoc(postRef, { [`commentLikes.${ci}`]: increment(1) }); } catch (e) { console.error(e); }
            }
        };

        window.toggleReplyLike = async function (ci, ri) {
            const r = POST_DATA.comments[ci]?.replies?.[ri];
            if (!r) return;
            r.likes = (r.likes || 0) + 1;
            renderPost();
            if (postRef && updateDoc) {
                try { await updateDoc(postRef, { [`commentLikes.${ci}_${ri}`]: increment(1) }); } catch (e) { console.error(e); }
            }
        };

        renderPost();
        initFirebase();
    </script>
</body>
</html>
