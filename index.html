        let POST_DATA = JSON.parse(JSON.stringify(DEFAULT_POST_DATA));
        let db, postRef;

        // Firebase 연동 초기화
        async function initFirebase() {
            try {
                const BASE = "https://www.gstatic.com/firebasejs/11.6.1/";
                const [{ initializeApp }, { getAuth, signInAnonymously, signInWithCustomToken }, fs] = await Promise.all([
                    import(BASE + "firebase-app.js"),
                    import(BASE + "firebase-auth.js"),
                    import(BASE + "firebase-firestore.js")
                ]);
                const { getFirestore, doc, onSnapshot, setDoc } = fs;
                updateDoc = fs.updateDoc;
                increment = fs.increment;

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'anonymous-forum-app';
                const firebaseConfig = typeof __firebase_config !== 'undefined' 
                    ? JSON.parse(__firebase_config) 
                    : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo-app" };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 공유 및 실시간 누적 데이터 문서 위치
                postRef = doc(db, 'artifacts', appId, 'public', 'data', 'forum_posts', 'main_post');

                // 실시간 데이터 동기화
                onSnapshot(postRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        POST_DATA.likes = cloudData.likes !== undefined ? cloudData.likes : 0;
                        if (cloudData.commentLikes) {
                            Object.keys(cloudData.commentLikes).forEach(key => {
                                const [cIdx, rIdx] = key.split('_').map(Number);
                                if (rIdx === undefined && POST_DATA.comments[cIdx]) {
                                    POST_DATA.comments[cIdx].likes = cloudData.commentLikes[key];
                                } else if (POST_DATA.comments[cIdx] && POST_DATA.comments[cIdx].replies && POST_DATA.comments[cIdx].replies[rIdx]) {
                                    POST_DATA.comments[cIdx].replies[rIdx].likes = cloudData.commentLikes[key];
                                }
                            });
                        }
                    } else {
                        // 문서가 없을 시 기본 0값으로 초기화 저장
                        setDoc(postRef, {
                            likes: 0,
                            commentLikes: {}
                        });
                    }
                    renderPost();
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    renderPost();
                });

            } catch (err) {
                console.warn("Firebase 연동 불가 (로컬 동작 모드):", err);
                renderPost();
            }
        }

        // 화면 렌더링 함수
        window.renderPost = function() {
            try {
                const titleEl = document.getElementById('displayPostTitle');
                const timeEl = document.getElementById('displayPostTime');
                const viewsEl = document.getElementById('displayViews');
                const likesEl = document.getElementById('displayLikes');
                const contentEl = document.getElementById('displayPostContent');

                if (titleEl) titleEl.innerText = POST_DATA.title || '';
                if (timeEl) timeEl.innerText = POST_DATA.time || '방금 전';
                if (viewsEl) viewsEl.innerText = (POST_DATA.views || 0).toLocaleString();
                if (likesEl) likesEl.innerText = (POST_DATA.likes || 0).toLocaleString();
                if (contentEl) contentEl.innerText = POST_DATA.content || '';

                const commentsContainer = document.getElementById('commentsContainer');
                if (!commentsContainer) return;
                commentsContainer.innerHTML = '';

                const comments = POST_DATA.comments || [];
                let totalCommentCount = comments.length;
                
                comments.forEach(c => {
                    if (c.replies && c.replies.length > 0) {
                        totalCommentCount += c.replies.length;
                    }
                });

                const commentCountEl = document.getElementById('displayCommentCount');
                if (commentCountEl) commentCountEl.innerText = totalCommentCount;

                comments.forEach((comment, cIndex) => {
                    const commentEl = document.createElement('div');
                    commentEl.className = 'w-full bg-slate-50 dark:bg-slate-800/60 rounded-xl px-3 py-3 text-left border border-slate-100 dark:border-slate-800';
                    
                    let htmlContent = `
                        <!-- 닉네임 영역 -->
                        <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 mb-2">
                            <div class="flex items-center space-x-1 font-semibold text-gray-700 dark:text-gray-300">
                                <span class="text-[10px]">🍎</span>
                                <span>${comment.author || '익명'}</span>
                            </div>
                            <div class="flex items-center space-x-2 text-[11px]">
                                <span>${comment.time || ''}</span>
                                <button onclick="toggleCommentLike(${cIndex})" class="flex items-center text-red-500 font-medium hover:text-red-600 transition-transform active:scale-125 cursor-pointer select-none">
                                    <i data-lucide="thumbs-up" class="w-3 h-3 mr-0.5 inline"></i>
                                    <span>${comment.likes || 0}</span>
                                </button>
                            </div>
                        </div>
                        <!-- 댓글 본문 -->
                        <div class="text-xs sm:text-sm text-gray-800 dark:text-gray-200 break-words font-normal leading-relaxed mb-1">
                            ${comment.text || ''}
                        </div>
                    `;

                    // 대댓글 처리
                    if (comment.replies && comment.replies.length > 0) {
                        comment.replies.forEach((reply, rIndex) => {
                            const isMore = reply.hasMoreBtn;
                            const moreBtnHtml = isMore 
                                ? `<button onclick="this.parentElement.innerText='삭제된 댓글입니다.';" class="ml-1 text-[11px] text-gray-400 hover:text-red-500 underline cursor-pointer">[더보기]</button>` 
                                : '';

                            htmlContent += `
                                <div class="mt-2.5 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 pl-3 border-l-2 border-l-red-400 dark:border-l-red-500">
                                    <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 mb-1.5">
                                        <div class="flex items-center space-x-1 font-semibold text-gray-700 dark:text-gray-300">
                                            <span class="text-[10px]">↳ 🍎</span>
                                            <span>${reply.author || '익명'}</span>
                                        </div>
                                        <div class="flex items-center space-x-2 text-[11px]">
                                            <span>${reply.time || ''}</span>
                                            <button onclick="toggleReplyLike(${cIndex}, ${rIndex})" class="flex items-center text-red-500 font-medium hover:text-red-600 transition-transform active:scale-125 cursor-pointer select-none">
                                                <i data-lucide="thumbs-up" class="w-3 h-3 mr-0.5 inline"></i>
                                                <span>${reply.likes || 0}</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="reply-text text-xs sm:text-sm text-gray-800 dark:text-gray-200 break-words font-normal leading-relaxed">
                                        ${reply.text || ''}${moreBtnHtml}
                                    </div>
                                </div>
                            `;
                        });
                    }

                    commentEl.innerHTML = htmlContent;
                    commentsContainer.appendChild(commentEl);
                });

                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                }
            } catch (err) {
                console.error("Rendering error:", err);
            }
        };

        // 본문 실시간 좋아요 누적
        window.togglePostLike = async function() {
            POST_DATA.likes = (POST_DATA.likes || 0) + 1;
            renderPost();
            if (postRef && updateDoc) {
                try {
                    await updateDoc(postRef, { likes: increment(1) });
                } catch (e) { console.error(e); }
            }
        };

        // 댓글 실시간 좋아요 누적
        window.toggleCommentLike = async function(cIndex) {
            if (POST_DATA.comments[cIndex]) {
                POST_DATA.comments[cIndex].likes = (POST_DATA.comments[cIndex].likes || 0) + 1;
                renderPost();
                if (postRef && updateDoc) {
                    try {
                        const fieldKey = `commentLikes.${cIndex}`;
                        await updateDoc(postRef, { [fieldKey]: increment(1) });
                    } catch (e) { console.error(e); }
                }
            }
        };

        // 대댓글 실시간 좋아요 누적
        window.toggleReplyLike = async function(cIndex, rIndex) {
            if (POST_DATA.comments[cIndex] && POST_DATA.comments[cIndex].replies[rIndex]) {
                POST_DATA.comments[cIndex].replies[rIndex].likes = (POST_DATA.comments[cIndex].replies[rIndex].likes || 0) + 1;
                renderPost();
                if (postRef && updateDoc) {
                    try {
                        const fieldKey = `commentLikes.${cIndex}_${rIndex}`;
                        await updateDoc(postRef, { [fieldKey]: increment(1) });
                    } catch (e) { console.error(e); }
                }
            }
        };

        // 초기화 실행: 먼저 글을 그리고, 그 다음 Firebase 연결 시도
        renderPost();
        initFirebase();
    </script>
